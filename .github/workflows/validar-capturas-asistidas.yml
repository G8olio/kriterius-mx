name: Validar capturas asistidas sin consultas judiciales
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'sjf_semanal.py'
      - 'sjf_local.py'
      - 'enlazar_registros.py'
      - 'resolver_registros.py'
      - 'test_enlazar_registros.py'
      - 'test_tesis_local.py'
      - 'tepjf.py'
      - 'server_http.py'
      - 'kriterius_mx.py'
      - '*ejecutorias*.py'
      - 'fixtures_ejecutorias/**'
      - 'sincronizar_*.py'
      - 'gacetas/**'
      - 'test_actualizacion_acervo.py'
      - 'test_acervo_permanente.py'
      - 'pyproject.toml'
      - 'kriterius_datos/**'
      - 'importar_semanal.py'
      - 'flujo_semanal.py'
      - 'guardia_vpn.py'
      - 'publicar_semanal.py'
      - '*chrome.mjs'
      - 'test_*semanal.py'
      - 'validar_semanal_distribuido.py'
      - 'kriterius_datos/sjf_semanal/**'
      - 'fixtures_semanal/**'
      - '.github/workflows/validar-capturas-asistidas.yml'
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Integridad e importación sin red
        run: python -m unittest test_sjf_semanal test_capturar_semanal test_importar_semanal test_flujo_semanal test_publicar_semanal test_acervo_permanente test_actualizacion_acervo test_ejecutorias_local test_acceso_scjn test_tesis_local test_enlazar_registros
      - name: Auditar cobertura completa de registros sin consultas judiciales
        run: python resolver_registros.py --verificar --informe "$RUNNER_TEMP/cobertura-registros"
      - name: Regresiones del acervo SCJN y TEPJF
        run: |
          python test_sjf_local.py
          python test_waf.py
          python test_sjf_incremental.py
          python test_sjf_respaldo.py
          python test_sincronizar_gacetas.py
          python test_tepjf.py
          python test_sincronizar_tepjf.py
          python test_ejecutorias.py
          python test_repositorio.py
      - name: Control de Chrome y permisos de VPN sin red
        run: node --test test_captura_chrome.mjs
      - name: Construir e instalar distribución
        run: |
          python -m pip wheel --no-deps . -w "$RUNNER_TEMP/ruedas"
          python -m pip install --no-deps "$RUNNER_TEMP"/ruedas/*.whl
          cp test_tesis_local.py "$RUNNER_TEMP/test_tesis_local.py"
          cp validar_semanal_distribuido.py "$RUNNER_TEMP/validar_semanal_distribuido.py"
          cp validar_ejecutorias_distribuidas.py "$RUNNER_TEMP/validar_ejecutorias_distribuidas.py"
      - name: Consultar las fichas permanentes desde el core instalado
        working-directory: ${{ runner.temp }}
        run: |
          python -m unittest test_tesis_local
          python validar_semanal_distribuido.py respuestas
          python validar_ejecutorias_distribuidas.py respuestas
      - name: Verificar la imagen de producción sin red judicial
        run: |
          docker build -t kriterius-acervo .
          docker run --rm --memory=512m --network none -e PYTHONPATH=/app -v "$PWD/test_tesis_local.py:/tmp/test_tesis_local.py:ro" kriterius-acervo python /tmp/test_tesis_local.py
          docker run --rm --network none kriterius-acervo python -c "import sjf_local, tepjf; n=sjf_local.cargar(); m=sjf_local.meta(); assert n > 34000; assert m['capturas_permanentes'] >= 30; assert tepjf.cargar() >= 2078; print(n, m['publicacion_sjf_hasta'])"
          docker run --rm --network none -e PYTHONPATH=/app -v "$PWD/validar_semanal_distribuido.py:/tmp/validar.py:ro" kriterius-acervo python /tmp/validar.py /tmp/respuestas
          docker run --rm --memory=512m --network none -e PYTHONPATH=/app -v "$PWD/validar_ejecutorias_distribuidas.py:/tmp/validar.py:ro" kriterius-acervo python /tmp/validar.py /tmp/respuestas
      - uses: actions/upload-artifact@v4
        with:
          name: respuestas-semanal-sin-red
          path: |
            ${{ runner.temp }}/respuestas/
            ${{ runner.temp }}/cobertura-registros/
          retention-days: 30
